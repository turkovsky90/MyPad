<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="notepad">
<title>ascii notepad</title>
<link id="mf" rel="manifest">
<style>
:root{
  --bg:#0b0b0b; --fg:#d8d8d8; --dim:#5c5c5c;
  --green:#7ee787; --cyan:#79c0ff; --yellow:#e3b341; --red:#ff7b72; --purple:#d2a8ff;
  --orange:#ffa657; --blue:#58a6ff;
  --fs:19px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;
  color:var(--fg);background:var(--bg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  font-size:var(--fs);line-height:1.5;
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  gap:0;
}
#tabs{
  flex:0 0 auto;
  white-space:pre-wrap;
  line-height:1.5;
  word-break:keep-all;
  overflow:hidden;
  font:inherit;
  color:var(--fg);
  background:transparent;
}
#tabs .tab{
  display:inline-block;
  vertical-align:top;
  cursor:default;
  -webkit-tap-highlight-color:transparent;
}
#tabs .tab-active .tb-name,
#tabs .tab-active .tb-close{color:var(--fg)}
#tabs .tab-inactive .tb-name,
#tabs .tab-inactive .tb-close{color:var(--dim)}
#tabs .tb-add{color:var(--fg);cursor:default;-webkit-tap-highlight-color:transparent;display:inline-block;vertical-align:top}
#toolbar{
  flex:0 0 auto;
  white-space:pre-wrap;
  line-height:1.5;
  word-break:keep-all;
  overflow:hidden;
  font:inherit;
  color:var(--fg);
  background:transparent;
}
#toolbar .act{
  display:inline-block;
  vertical-align:top;
  padding:0;margin:0;border:0;
  font:inherit;line-height:inherit;
  color:#0b0b0b;
  background:transparent;
  cursor:default;
  -webkit-tap-highlight-color:transparent;
}
#toolbar .act.o{background:var(--orange)}
#toolbar .act.b{background:var(--blue)}
#toolbar .act.p{background:var(--purple)}
#toolbar .act.g{background:var(--green)}
#toolbar .act.c{background:var(--cyan)}
#toolbar .act.r{background:var(--red)}
#stats{
  flex:0 0 auto;
  color:var(--dim);
  white-space:pre;overflow:hidden;
}
#ta{
  flex:1 1 auto;
  width:100%;min-height:0;
  resize:none;border:0;outline:0;
  padding:0;margin:0;
  background:transparent;
  color:var(--fg);
  font:inherit;line-height:1.5;
  white-space:pre;
  overflow:auto;
  overflow-wrap:normal;word-break:normal;
  caret-color:var(--fg);
  user-select:text;-webkit-user-select:text;
  -webkit-appearance:none;border-radius:0;
}
#ta.wrap{white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
@media (max-width:600px){:root{--fs:16px}}
@media (min-width:601px) and (max-width:1000px){:root{--fs:17px}}
@media (min-width:1001px){:root{--fs:19px}}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="toolbar"><span class="act o" data-act="save">[save]</span> <span class="act b" data-act="open">[open]</span> <span class="act p" data-act="all">[all]</span> <span class="act g" data-act="tab">[tab]</span> <span class="act g" data-act="untab">[untab]</span> <span class="act c" data-act="wrap" id="wrapBtn">[wrap-]</span> <span class="act r" data-act="pgup">[pgup]</span> <span class="act r" data-act="pgdn">[pgdn]</span></div>
<div id="stats"></div>
<textarea id="ta" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="editor"></textarea>
<input id="file" type="file" hidden accept=".txt,.md,.markdown,.html,.htm,.json,.csv,.log,.xml,.css,.js,text/*">
<script>
(function(){
'use strict';

var KEY_TABS='asciinote.tabs', KEY_ACTIVE='asciinote.active', KEY_WRAP='asciinote.wrap', DEF_NAME='index.html';
var INDENT='  ';

var ta=document.getElementById('ta');
var statsEl=document.getElementById('stats');
var fileEl=document.getElementById('file');
var wrapBtn=document.getElementById('wrapBtn');
var toolbar=document.getElementById('toolbar');
var tabsEl=document.getElementById('tabs');

var wrapMode=false;
try{ wrapMode = localStorage.getItem(KEY_WRAP)==='1'; }catch(e){}

function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadTabsData(){
  var raw = lsGet(KEY_TABS);
  if(raw){
    try{
      var parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length > 0) return parsed;
    }catch(e){}
  }
  var oldText = lsGet('asciinote.text');
  var oldName = lsGet('asciinote.name') || DEF_NAME;
  if(oldName === 'note.html') oldName = DEF_NAME;
  return [{id:1, name:oldName, content:oldText || ''}];
}

var tabs = loadTabsData();
var activeTabId = parseInt(lsGet(KEY_ACTIVE) || '0', 10) || tabs[0].id;
if(!tabs.some(function(t){return t.id === activeTabId;})) activeTabId = tabs[0].id;
var tabCounter = 1;
tabs.forEach(function(t){ if(t.id >= tabCounter) tabCounter = t.id + 1; });

function findTab(id){
  for(var i=0;i<tabs.length;i++) if(tabs[i].id === id) return tabs[i];
  return null;
}

function saveTabsData(){
  try{
    lsSet(KEY_TABS, JSON.stringify(tabs));
    lsSet(KEY_ACTIVE, String(activeTabId));
  }catch(e){}
}

function renderTabs(){
  var html = '';
  var onlyOne = tabs.length <= 1;
  for(var i=0;i<tabs.length;i++){
    if(i>0) html += ' ';
    var t = tabs[i];
    var isActive = t.id === activeTabId;
    var cls = isActive ? 'tab tab-active' : 'tab tab-inactive';
    var dn = t.name.length > 16 ? t.name.substring(0,14) + '..' : t.name;
    html += '<span class="' + cls + '" data-tab-id="' + t.id + '">';
    if(onlyOne){
      html += '<span class="tb-name" data-action="name">[' + escHtml(dn) + ']</span>';
    } else {
      html += '<span class="tb-name" data-action="name">[' + escHtml(dn) + '</span>';
      html += '<span class="tb-close" data-action="close">\u00d7]</span>';
    }
    html += '</span>';
  }
  if(tabs.length > 0) html += ' ';
  html += '<span class="tb-add" data-action="add">[+]</span>';
  tabsEl.innerHTML = html;
}

function applyWrap(){
  if(wrapMode){ ta.classList.add('wrap'); wrapBtn.textContent='[wrap+]'; }
  else{ ta.classList.remove('wrap'); wrapBtn.textContent='[wrap-]'; }
}

function updateStats(){
  var v=ta.value;
  var c=v.length;
  var n=v.replace(/\s/g,'').length;
  var l=v===''?0:v.split('\n').length;
  statsEl.textContent='c:'+c+' w:'+n+' l:'+l;
}

function saveCurrentContentToTab(){
  var cur = findTab(activeTabId);
  if(cur) cur.content = ta.value;
}

var saveTimer=null;
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,400);
}
function flush(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  saveCurrentContentToTab();
  saveTabsData();
}

function setActiveTab(id){
  if(id === activeTabId){
    var t = findTab(id);
    if(t) ta.value = t.content;
    return;
  }
  saveCurrentContentToTab();
  activeTabId = id;
  var tab = findTab(id);
  if(!tab) return;
  ta.value = tab.content;
  updateStats();
  saveTabsData();
  renderTabs();
  ta.focus({preventScroll:true});
}

function addTab(){
  saveCurrentContentToTab();
  var newTab = {id: tabCounter++, name: DEF_NAME, content: ''};
  tabs.push(newTab);
  activeTabId = newTab.id;
  ta.value = '';
  updateStats();
  saveTabsData();
  renderTabs();
  ta.focus({preventScroll:true});
}

function closeTab(id){
  if(tabs.length <= 1) return;
  var idx = -1;
  for(var i=0;i<tabs.length;i++) if(tabs[i].id === id){ idx = i; break; }
  if(idx < 0) return;
  var wasActive = (id === activeTabId);
  tabs.splice(idx, 1);
  if(wasActive){
    var newIdx = Math.min(idx, tabs.length - 1);
    activeTabId = tabs[newIdx].id;
    ta.value = tabs[newIdx].content;
    updateStats();
  }
  saveTabsData();
  renderTabs();
  if(wasActive) ta.focus({preventScroll:true});
}

function renameTab(id){
  var tab = findTab(id);
  if(!tab) return;
  var input = null;
  try{ input = window.prompt('Rename tab:', tab.name); }catch(e){}
  if(input === null) return;
  input = String(input).trim();
  if(!input) return;
  tab.name = input;
  saveTabsData();
  renderTabs();
}

tabsEl.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(action === 'add'){
    e.preventDefault();
    addTab();
    return;
  }
  var tabEl = el.closest('[data-tab-id]');
  if(!tabEl) return;
  var id = parseInt(tabEl.getAttribute('data-tab-id'), 10);
  if(isNaN(id)) return;
  e.preventDefault();
  if(action === 'close'){
    closeTab(id);
  } else if(action === 'name'){
    if(id === activeTabId) renameTab(id);
    else setActiveTab(id);
  }
});

function getLineHeight(){
  var lh = parseFloat(getComputedStyle(ta).lineHeight);
  return lh>0 ? lh : 24;
}

var lastInputTime = 0;
var scrollSnapTimer = null;

function snapScroll(){
  if(Date.now() - lastInputTime < 300) return;
  var lh = getLineHeight();
  var snapped = Math.round(ta.scrollTop / lh) * lh;
  if(Math.abs(ta.scrollTop - snapped) > 0.5){
    ta.scrollTop = snapped;
  }
}

ta.addEventListener('scroll', function(){
  if(scrollSnapTimer) clearTimeout(scrollSnapTimer);
  scrollSnapTimer = setTimeout(snapScroll, 120);
});

ta.addEventListener('wheel', function(e){
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  if(e.deltaY === 0) return;
  e.preventDefault();
  var lh = getLineHeight();
  var dir = e.deltaY > 0 ? 1 : -1;
  var lines = Math.max(1, Math.round(Math.abs(e.deltaY) / 40));
  ta.scrollTop = ta.scrollTop + dir * lines * lh;
}, {passive:false});

function pageScroll(dir){
  var lh = getLineHeight();
  var lines = Math.max(1, Math.floor((ta.clientHeight - 30) / lh));
  ta.scrollTop = ta.scrollTop + dir * lines * lh;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function unesc(s){return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}

function wrapHtml(name,text){
  var t=name.replace(/[<>&"]/g,'');
  return '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>'+t+'</title>\n'+
    '<style>html,body{margin:0;background:#0b0b0b;color:#d8d8d8}'+
    'pre{margin:0;padding:16px;white-space:pre-wrap;word-wrap:break-word;'+
    'font:19px/1.5 ui-monospace,Menlo,Consolas,monospace}</style>\n'+
    '<pre id="n">'+esc(text)+'</pre>\n';
}

var MIME={html:'text/html',htm:'text/html',txt:'text/plain',log:'text/plain',
  md:'text/markdown',markdown:'text/markdown',json:'application/json',
  csv:'text/csv',xml:'application/xml',css:'text/css',js:'text/javascript'};

function saveAs(){
  flush();
  var cur = findTab(activeTabId);
  if(!cur) return;
  var def = cur.name || DEF_NAME;
  var input = null;
  try{ input = window.prompt('Save file as (filename with extension):', def); }
  catch(e){ input = def; }
  if(input===null) return;
  var fn = (input||'').trim() || def;
  if(!/\.[a-z0-9]+$/i.test(fn)) fn += '.html';
  cur.name = fn;
  saveTabsData();
  renderTabs();

  var ext = fn.split('.').pop().toLowerCase();
  var body = (ext==='html'||ext==='htm') ? wrapHtml(fn, ta.value) : ta.value;
  var mime = (MIME[ext]||'text/plain')+';charset=utf-8';

  try{
    var blob = new Blob([body],{type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fn; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){
      try{document.body.removeChild(a)}catch(e){}
      try{URL.revokeObjectURL(url)}catch(e){}
    },30000);
    return;
  }catch(e){}

  try{
    var dataUrl='data:'+mime+','+encodeURIComponent(body);
    var a2=document.createElement('a');
    a2.href=dataUrl; a2.download=fn;
    document.body.appendChild(a2); a2.click();
    setTimeout(function(){try{document.body.removeChild(a2)}catch(e){}},30000);
    return;
  }catch(e){}

  try{
    var w=window.open('','_blank');
    if(w && w.document){
      w.document.open();
      w.document.write('<!doctype html><meta charset="utf-8"><title>'+esc(fn)+'</title>');
      w.document.write('<style>body{background:#0b0b0b;color:#d8d8d8;font:14px/1.5 ui-monospace,monospace;margin:0;padding:16px}pre{white-space:pre-wrap;word-wrap:break-word}</style>');
      w.document.write('<pre>'+esc(body)+'</pre>');
      w.document.close();
    }
  }catch(e){}
}

function openFile(){ fileEl.value=''; fileEl.click(); }

function indent(wantUntab){
  ta.focus({preventScroll:true});
  var val=ta.value;
  var selA=Math.min(ta.selectionStart,ta.selectionEnd);
  var selB=Math.max(ta.selectionStart,ta.selectionEnd);
  var noSel=(selA===selB);

  var lineStartA=selA;
  while(lineStartA>0 && val.charAt(lineStartA-1)!=='\n') lineStartA--;

  var lineEndB=selB;
  while(lineEndB<val.length && val.charAt(lineEndB)!=='\n') lineEndB++;

  var block=val.slice(lineStartA,lineEndB);
  var lines=block.split('\n');
  var newLines=[];
  var delta=0;

  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(wantUntab){
      var m=line.match(/^[ ]*/);
      var sp=m?m[0].length:0;
      var rem=Math.min(sp,INDENT.length);
      if(rem>0){ newLines.push(line.slice(rem)); delta-=rem; }
      else newLines.push(line);
    } else {
      newLines.push(INDENT+line);
      delta+=INDENT.length;
    }
  }

  var newBlock=newLines.join('\n');
  ta.setRangeText(newBlock, lineStartA, lineEndB, 'end');

  if(noSel){
    var newCur;
    if(wantUntab){
      var m0=lines[0].match(/^[ ]*/);
      var sp0=m0?m0[0].length:0;
      var rem0=Math.min(sp0,INDENT.length);
      newCur=Math.max(lineStartA, selA-rem0);
    } else {
      newCur=selA+INDENT.length;
    }
    ta.setSelectionRange(newCur,newCur);
  } else {
    ta.setSelectionRange(lineStartA, lineEndB+delta);
  }

  updateStats();
  scheduleSave();
}

function toggleWrap(){
  wrapMode=!wrapMode;
  lsSet(KEY_WRAP,wrapMode?'1':'0');
  applyWrap();
}

function doAction(id){
  if(id==='save') saveAs();
  else if(id==='open') openFile();
  else if(id==='all'){ ta.focus({preventScroll:true}); ta.select(); updateStats(); }
  else if(id==='tab') indent(false);
  else if(id==='untab') indent(true);
  else if(id==='wrap') toggleWrap();
  else if(id==='pgup') pageScroll(-1);
  else if(id==='pgdn') pageScroll(1);
}

toolbar.addEventListener('click', function(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  e.preventDefault();
  doAction(btn.getAttribute('data-act'));
});

ta.addEventListener('input', function(){
  lastInputTime = Date.now();
  updateStats();
  scheduleSave();
});
ta.addEventListener('select', updateStats);
ta.addEventListener('click', updateStats);
ta.addEventListener('keyup', updateStats);

ta.addEventListener('keydown', function(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if(ctrl && !e.shiftKey && (e.key==='s'||e.key==='S')){ e.preventDefault(); saveAs(); return; }
  if(ctrl && (e.key==='o'||e.key==='O')){ e.preventDefault(); openFile(); return; }
  if(e.key==='Tab'){ e.preventDefault(); indent(e.shiftKey); return; }
  if(e.key==='PageUp'){ e.preventDefault(); pageScroll(-1); return; }
  if(e.key==='PageDown'){ e.preventDefault(); pageScroll(1); return; }

  if(e.key==='Enter'){
    var pos=ta.selectionStart;
    var val=ta.value;
    var lineStart=pos;
    while(lineStart>0 && val.charAt(lineStart-1)!=='\n') lineStart--;
    var currentLine=val.slice(lineStart,pos);

    var indentMatch=currentLine.match(/^([ \t]*)/);
    var ind=indentMatch?indentMatch[1]:'';
    var cont='';

    var listMatch=currentLine.match(/^([ \t]*)(-|\*|\+|(\d+)\.)\s/);
    if(listMatch){
      ind=listMatch[1];
      var marker=listMatch[2];
      if(/^\d+\.$/.test(marker)){
        var num=parseInt(marker,10);
        cont=ind+(num+1)+'. ';
      } else {
        cont=ind+marker+' ';
      }
    } else if(ind){
      cont=ind;
    }

    e.preventDefault();
    ta.setRangeText('\n'+cont, pos, ta.selectionEnd, 'end');
    lastInputTime = Date.now();
    updateStats();
    scheduleSave();
    return;
  }
});

fileEl.addEventListener('change', function(){
  var f=fileEl.files && fileEl.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var t=String(rd.result||'');
    if(/\.html?$/i.test(f.name)){
      var m=t.match(/<pre id="n">([\s\S]*?)<\/pre>/i);
      if(m) t=unesc(m[1]);
    }
    saveCurrentContentToTab();
    var newTab = {id: tabCounter++, name: f.name, content: t};
    tabs.push(newTab);
    activeTabId = newTab.id;
    ta.value = t;
    ta.setSelectionRange(t.length, t.length);
    updateStats();
    saveTabsData();
    renderTabs();
    ta.focus({preventScroll:true});
  };
  rd.readAsText(f);
});

window.addEventListener('beforeunload', flush);
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', function(){ if(document.hidden) flush(); });

function icon(size){
  var c=document.createElement('canvas');
  c.width=c.height=size;
  var x=c.getContext('2d');
  x.fillStyle='#0b0b0b'; x.fillRect(0,0,size,size);
  x.fillStyle='#7ee787';
  x.font='bold '+Math.round(size*0.32)+'px ui-monospace,Menlo,Consolas,monospace';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText('>_',size/2,size*0.52);
  return c.toDataURL('image/png');
}

try{
  var i192=icon(192),i512=icon(512),i180=icon(180),i64=icon(64);
  var base=location.href.split('#')[0].split('?')[0];
  var scope=base.replace(/[^/]*$/,'');
  var manifest={
    name:'ascii notepad',short_name:'notepad',description:'Pure text notepad',
    start_url:base,scope:scope,
    display:'standalone',orientation:'any',
    background_color:'#0b0b0b',theme_color:'#0b0b0b',
    icons:[
      {src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
      {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},
      {src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}
    ]
  };
  var json=JSON.stringify(manifest);
  var b64;
  try{
    var bytes=new TextEncoder().encode(json);
    var bin='';
    for(var bi=0;bi<bytes.length;bi++) bin+=String.fromCharCode(bytes[bi]);
    b64=btoa(bin);
  }catch(e){ b64=btoa(unescape(encodeURIComponent(json))); }
  document.getElementById('mf').href='data:application/manifest+json;base64,'+b64;
  var ap=document.createElement('link'); ap.rel='apple-touch-icon'; ap.href=i180; document.head.appendChild(ap);
  var fv=document.createElement('link'); fv.rel='icon'; fv.href=i64; document.head.appendChild(fv);
}catch(e){}

applyWrap();
var initialTab = findTab(activeTabId);
ta.value = initialTab ? initialTab.content : '';
updateStats();
renderTabs();

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ updateStats(); });
}

setTimeout(function(){ ta.focus({preventScroll:true}); }, 100);

})();
</script>
</body>
</html>
